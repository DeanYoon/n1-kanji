name: build-word-list

# 매일 오전 6시(KST)에 자동으로 도는 누적 생성 워크플로우 — jlpt-word-list N1 단어(2699개)를
# 하루에 DAILY_COUNT(기본 45 = 15개씩 3청크)개씩만 처리해서 data/n1-words.json 에 계속
# 이어붙인다(덮어쓰지 않음). 전체가 다 채워지면 그 이후로는 자동으로 API 호출 없이 종료.
#
# cron 은 항상 UTC 기준. KST(UTC+9) 06:00 = 전날 21:00 UTC.
#   환산: UTC + 9h = KST  /  KST - 9h = UTC
# ⚠️ GitHub Actions 의 schedule 은 정확한 시각을 보장하지 않는다(러너 혼잡 시 수십 분 늦게
#    뜰 수 있음) — 크게 문제 되는 스케줄은 아니라 별도 여유는 안 뒀음.
# 주말(KST 토·일)에는 실행하지 않음 — dow 필드는 UTC 기준 요일이라 KST 대비 하루 당겨서
# 지정: UTC 일~목(0-4) 21:00 = KST 월~금(1-5) 06:00.

on:
  schedule:
    - cron: "0 21 * * 0-4"
  workflow_dispatch:
    inputs:
      daily_count:
        description: "오늘 처리할 단어 수(기본 45 = 청크 크기의 배수 권장)"
        type: string
        default: "45"
      chunk_size:
        description: "한 번의 OpenRouter 호출에 담을 단어 수"
        type: string
        default: "15"
      limit:
        description: "테스트용 — 오늘 배치를 이 개수로 강제 제한(0=daily_count 그대로)"
        type: string
        default: "0"

# 스케줄 실행과 수동 실행이 겹쳐 data/n1-words.json 을 동시에 쓰는 일이 없도록 직렬화.
concurrency:
  group: build-word-list
  cancel-in-progress: false

permissions:
  contents: write   # data/n1-words.json 커밋·푸시에 필요

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      MODEL: openai/gpt-5.6-sol
      DAILY_COUNT: ${{ inputs.daily_count || '45' }}
      CHUNK_SIZE: ${{ inputs.chunk_size || '15' }}
      LIMIT: ${{ inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: build-word-list
        run: node scripts/build-word-list.mjs

      - name: commit changes
        run: |
          git config user.name "n1-kanji-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/n1-words.json
          if git diff --cached --quiet; then
            echo "변경 사항 없음 — 커밋 생략"
          else
            git commit -m "chore: N1 단어+예문 데이터 누적 생성 (자동, jlpt-word-list)"
            git push
          fi
