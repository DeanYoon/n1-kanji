name: generate-day

# 하루치 예문 슬롯을 클라우드에서 미리 만들어 Gist 에 올린다.
# 폰이 꺼져 있어도 그날 09:00~23:00 슬롯이 준비돼 있게 하는 게 목적.

on:
  schedule:
    # cron 은 항상 UTC 기준. 목표는 한국시간(KST, UTC+9) 05:00 실행 —
    # 그날 첫 슬롯(09:00)보다 충분히 앞서 하루치를 만들어 두기 위함.
    #   KST 05:00 = JST 05:00 = 20:00 UTC (전날)  (KST 와 JST 는 둘 다 UTC+9, 서머타임 없음)
    #   환산:  UTC + 9h = KST/JST   /   KST/JST - 9h = UTC
    # ⚠️ GitHub Actions 의 schedule 은 정확한 시각을 보장하지 않는다. 러너가 붐비면
    #    수 분~수십 분(때로는 1시간 가까이) 늦게 뜨거나 아예 건너뛸 수 있다.
    #    따라서 "05:00 정각에 끝난다"고 가정하는 다운스트림(폰 알림 예약 등)은
    #    충분한 여유를 두고 실행할 것.
    # 크론은 "매일" 그대로 둔다 — 주말(KST 토·일)에는 scripts/generate-day.mjs 가
    # 스스로 신규 생성을 건너뛰고(진도 0 전진, API 0회) 전량 복습으로 그날치를 채운다.
    # 평일로 줄이면 주말에 폰이 "오늘치 없음"으로 실패해 알림이 아예 안 오므로 안 줄인다.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "계획만 출력 (API 호출·Gist 쓰기 없음)"
        type: boolean
        default: false
      force:
        description: "오늘 이미 만들었어도 다시 생성"
        type: boolean
        default: false
      new_anyway:
        description: "주말이라도 신규 생성 강행 (주말 스킵 무시)"
        type: boolean
        default: false

# 스케줄 실행과 수동 실행이 겹쳐 Gist 를 동시에 쓰는 일이 없도록 직렬화.
concurrency:
  group: generate-day
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      # 생성 모델을 여기에 명시 — 코드 기본값이 나중에 바뀌어도 클라우드 동작이 흔들리지 않게.
      # ⚠️ 모델 변경 시 폰의 n1-config.js(Keychain N1_MODEL)도 함께 갱신해야 폰·클라우드가 어긋나지 않음.
      MODEL: openai/gpt-5.6-sol
      # GIST_ID / INIT_PROGRESS_INDEX 를 바꾸려면 여기(또는 repo variables)에서 지정.
      # 미지정 시 scripts/generate-day.mjs 의 기본값 사용.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: generate-day
        # 스크립트가 0 이 아닌 코드로 끝나면(die()) 이 스텝이 실패 → 워크플로가 빨갛게 뜬다.
        run: node scripts/generate-day.mjs ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }} ${{ inputs.new_anyway && '--new-anyway' || '' }}
