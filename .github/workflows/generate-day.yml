name: generate-day

# 하루치 예문 슬롯을 클라우드에서 미리 만들어 Gist 에 올린다.
# 폰이 꺼져 있어도 그날 09:00~23:00 슬롯이 준비돼 있게 하는 게 목적.

on:
  schedule:
    # cron 은 항상 UTC 기준. 목표는 일본시간(JST, UTC+9) 10:00 실행.
    #   JST 10:00 = KST 10:00 = 01:00 UTC   (JST 와 KST 는 둘 다 UTC+9, 서머타임 없음)
    #   환산:  UTC + 9h = JST/KST   /   JST/KST - 9h = UTC
    # ⚠️ GitHub Actions 의 schedule 은 정확한 시각을 보장하지 않는다. 러너가 붐비면
    #    수 분~수십 분(때로는 1시간 가까이) 늦게 뜨거나 아예 건너뛸 수 있다.
    #    따라서 "10:00 정각에 끝난다"고 가정하는 다운스트림(폰 알림 예약 등)은
    #    충분한 여유를 두고 실행할 것.
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "계획만 출력 (API 호출·Gist 쓰기 없음)"
        type: boolean
        default: false
      force:
        description: "오늘 이미 만들었어도 다시 생성"
        type: boolean
        default: false

# 스케줄 실행과 수동 실행이 겹쳐 Gist 를 동시에 쓰는 일이 없도록 직렬화.
concurrency:
  group: generate-day
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
      GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
      # 생성 모델을 여기에 명시 — 코드 기본값이 나중에 바뀌어도 클라우드 동작이 흔들리지 않게.
      # ⚠️ 모델 변경 시 폰의 n1-config.js(Keychain N1_MODEL)도 함께 갱신해야 폰·클라우드가 어긋나지 않음.
      MODEL: openai/gpt-5.6-sol
      # GIST_ID / INIT_PROGRESS_INDEX 를 바꾸려면 여기(또는 repo variables)에서 지정.
      # 미지정 시 scripts/generate-day.mjs 의 기본값 사용.
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: generate-day
        # 스크립트가 0 이 아닌 코드로 끝나면(die()) 이 스텝이 실패 → 워크플로가 빨갛게 뜬다.
        run: node scripts/generate-day.mjs ${{ inputs.dry_run && '--dry-run' || '' }} ${{ inputs.force && '--force' || '' }}
